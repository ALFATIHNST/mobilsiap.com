version: '3.8'

services:
  frontend:
    build: ./frontend
    container_name: mobilsiap_frontend
    ports:
      - "8080:80"
    restart: always

  backend:
    build: ./backend
    container_name: mobilsiap_backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend/public:/app/public
      - ./backend/.wwebjs_auth:/app/.wwebjs_auth
    restart: always
